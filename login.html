<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Quản trị</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="login-wrapper">
      <div class="login-card">
        <section class="card-left">
          <h2 class="welcome-heading">Hello, Admin!</h2>
          <div class="illustration-box">
            <img
              class="welcome-art"
              src="images/anhlogin.png"
              alt="Ảnh minh họa"
            />
          </div>
        </section>

        <section class="card-right">
          <h1 class="login-title">Đăng nhập quản trị</h1>

          <form action="admin.html" method="get" novalidate>
            <div class="input-group">
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
              />
              <span class="input-icon" title="Username">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >
                  <path
                    d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"
                  />
                </svg>
              </span>
            </div>

            <div class="input-group">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
              />
              <span class="input-icon" title="Password">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >
                  <path
                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
                  />
                </svg>
              </span>
            </div>

            <div class="form-sub-row">
              <label class="remember-me">
                <input type="checkbox" name="remember" />
                <span>Ghi nhớ</span>
              </label>
              <a href="#" class="forgot-pwd">Quên mật khẩu?</a>
            </div>

            <button class="btn-submit" type="submit">Đăng nhập</button>

            <div class="back-home-wrap">
              <a class="back-home-link" href="index.html"
                >← Quay lại trang chủ</a
              >
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
